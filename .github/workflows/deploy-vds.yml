name: Deploy Backend to VDS (jobaisearch.ru)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VDS via rsync
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete --exclude='.env' --exclude='.env.example' --exclude='__pycache__/' --exclude='*.pyc' --exclude='.git/' --exclude='logs/' --exclude='venv/' --exclude='.DS_Store'
          path: /
          remote_path: /var/www/jobaisearch/backend/JobAISeacrh_Backend
          remote_host: ${{ secrets.VDS_HOST }}
          remote_user: ${{ secrets.VDS_USERNAME }}
          remote_key: ${{ secrets.VDS_SSH_KEY }}

      - name: Deploy on VDS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USERNAME }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script_stop: true
          script: |
            set -e

            cd /var/www/jobaisearch/backend/JobAISeacrh_Backend

            # Ensure logs directory exists
            mkdir -p logs

            # Create venv if it doesn't exist
            if [ ! -d "venv" ]; then
              echo "Creating Python virtual environment..."
              python3 -m venv venv
            fi

            echo "📦 Installing/updating Python dependencies..."
            ./venv/bin/pip install -r requirements.txt --quiet

            echo "🔄 Restarting application..."
            # Kill any existing processes on port 8000
            sudo fuser -k 8000/tcp 2>/dev/null || true
            sleep 2

            # Note: Backend is managed by jobaisearch.service which runs both frontend and backend
            # Just need to restart the systemd service
            sudo systemctl restart jobaisearch.service

            echo "⏳ Waiting for app to be ready..."
            sleep 15

            echo "✅ Deployment complete!"
            sudo systemctl status jobaisearch.service --no-pager | head -20

            # Health check
            echo ""
            echo "🔍 Health check:"
            curl -sf http://localhost:8000/health && echo "✓ Backend is healthy" || echo "✗ Backend health check failed"
