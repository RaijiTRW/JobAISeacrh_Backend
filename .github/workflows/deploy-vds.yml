name: Deploy Backend to VDS (jobaisearch.ru)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-jobaisearch-backend-vds
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VDS_SSH_KEY }}

      - name: Deploy backend repo snapshot to VDS via rsync (with retry)
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USERNAME: ${{ secrets.VDS_USERNAME }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          RSYNC_RSH="ssh -p 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=15 -o ServerAliveCountMax=6 -o ConnectTimeout=20"

          attempt=1
          max_attempts=5
          while true; do
            echo "rsync attempt ${attempt}/${max_attempts}"
            set +e
            rsync -avzr --delete \
              --exclude='.env' \
              --exclude='.env.example' \
              --exclude='__pycache__/' \
              --exclude='*.pyc' \
              --exclude='.git/' \
              --exclude='logs/' \
              --exclude='venv/' \
              --exclude='.DS_Store' \
              --exclude='._*' \
              -e "$RSYNC_RSH" \
              ./ "${VDS_USERNAME}@${VDS_HOST}:/var/www/jobaisearch/repo/backend/JobAISeacrh_Backend/"
            rc=$?
            set -e

            if [ "$rc" -eq 0 ]; then
              break
            fi

            if [ "$rc" -ne 255 ] || [ "$attempt" -ge "$max_attempts" ]; then
              echo "rsync failed with exit code $rc"
              exit "$rc"
            fi

            sleep_seconds=$((attempt * 10))
            echo "rsync SSH connection dropped (code 255), retrying in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Zero-downtime deploy on VDS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USERNAME }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: 22
          command_timeout: 45m
          script_stop: true
          script: |
            set -euo pipefail

            max_attempts=20
            attempt=1
            while true; do
              tmp_log="$(mktemp)"
              set +e
              sudo /usr/local/bin/jobaisearch-deploy >"$tmp_log" 2>&1 &
              deploy_pid=$!
              while kill -0 "$deploy_pid" 2>/dev/null; do
                echo "[deploy] running..."
                sleep 15
              done
              wait "$deploy_pid"
              DEPLOY_STATUS=$?
              set -e

              if [ "$DEPLOY_STATUS" -eq 0 ]; then
                tail -n 200 "$tmp_log" || true
              else
                cat "$tmp_log" || true
              fi

              if [ "$DEPLOY_STATUS" -eq 0 ]; then
                rm -f "$tmp_log"
                break
              fi

              if grep -q "Deploy already running" "$tmp_log"; then
                rm -f "$tmp_log"
                if [ "$attempt" -ge "$max_attempts" ]; then
                  echo "Timed out waiting for deploy lock" >&2
                  exit 1
                fi
                echo "Deploy lock is busy (${attempt}/${max_attempts}), waiting 20s..."
                attempt=$((attempt + 1))
                sleep 20
                continue
              fi

              rm -f "$tmp_log"
              exit "$DEPLOY_STATUS"
            done

            ACTIVE_SLOT="$(sudo cat /etc/jobaisearch/active_slot)"
            echo "active-slot:${ACTIVE_SLOT}"

            curl -kfsS -o /dev/null -w "site:%{http_code}\n" https://jobaisearch.ru/
            curl -kfsS -o /dev/null -w "health:%{http_code}\n" https://jobaisearch.ru/health
