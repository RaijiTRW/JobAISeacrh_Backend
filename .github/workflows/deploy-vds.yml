name: Deploy Backend to VDS (jobaisearch.ru)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-jobaisearch-backend-vds
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deploy backend repo snapshot to VDS via rsync
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: >-
            -avzr --delete
            --exclude='.env'
            --exclude='.env.example'
            --exclude='__pycache__/'
            --exclude='*.pyc'
            --exclude='.git/'
            --exclude='logs/'
            --exclude='venv/'
            --exclude='.DS_Store'
            --exclude='._*'
          path: ./
          remote_path: /var/www/jobaisearch/repo/backend/JobAISeacrh_Backend/
          remote_host: ${{ secrets.VDS_HOST }}
          remote_user: ${{ secrets.VDS_USERNAME }}
          remote_key: ${{ secrets.VDS_SSH_KEY }}

      - name: Zero-downtime deploy on VDS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USERNAME }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: 22
          command_timeout: 45m
          script_stop: true
          script: |
            set -euo pipefail

            sudo /usr/local/bin/jobaisearch-deploy

            ACTIVE_SLOT="$(sudo cat /etc/jobaisearch/active_slot)"
            echo "active-slot:${ACTIVE_SLOT}"

            if [ "${ACTIVE_SLOT}" = "blue" ]; then
              sudo systemctl is-active --quiet jobaisearch-frontend-blue.service
              sudo systemctl is-active --quiet jobaisearch-backend-blue.service
            else
              sudo systemctl is-active --quiet jobaisearch-frontend-green.service
              sudo systemctl is-active --quiet jobaisearch-backend-green.service
            fi
            sudo systemctl is-active --quiet caddy.service
            echo "services:active"

            curl -kfsS -o /dev/null -w "site:%{http_code}\n" https://jobaisearch.ru/
            curl -kfsS -o /dev/null -w "health:%{http_code}\n" https://jobaisearch.ru/health
