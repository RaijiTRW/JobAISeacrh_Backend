name: Deploy Backend to VDS (jobaisearch.ru)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-jobaisearch-backend-vds
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deploy backend repo snapshot to VDS via rsync
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: >-
            -avzr --delete
            --exclude='.env'
            --exclude='.env.example'
            --exclude='__pycache__/'
            --exclude='*.pyc'
            --exclude='.git/'
            --exclude='logs/'
            --exclude='venv/'
            --exclude='.DS_Store'
            --exclude='._*'
          path: ./
          remote_path: /var/www/jobaisearch/repo/backend/JobAISeacrh_Backend/
          remote_host: ${{ secrets.VDS_HOST }}
          remote_user: ${{ secrets.VDS_USERNAME }}
          remote_key: ${{ secrets.VDS_SSH_KEY }}

      - name: Zero-downtime deploy on VDS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USERNAME }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: 22
          command_timeout: 45m
          script_stop: true
          script: |
            set -euo pipefail

            max_attempts=20
            attempt=1
            while true; do
              set +e
              DEPLOY_OUTPUT="$(sudo /usr/local/bin/jobaisearch-deploy 2>&1)"
              DEPLOY_STATUS=$?
              set -e

              printf '%s\n' "$DEPLOY_OUTPUT"

              if [ "$DEPLOY_STATUS" -eq 0 ]; then
                break
              fi

              if printf '%s\n' "$DEPLOY_OUTPUT" | grep -q "Deploy already running"; then
                if [ "$attempt" -ge "$max_attempts" ]; then
                  echo "Timed out waiting for deploy lock" >&2
                  exit 1
                fi
                echo "Deploy lock is busy (${attempt}/${max_attempts}), waiting 20s..."
                attempt=$((attempt + 1))
                sleep 20
                continue
              fi

              exit "$DEPLOY_STATUS"
            done

            ACTIVE_SLOT="$(sudo cat /etc/jobaisearch/active_slot)"
            echo "active-slot:${ACTIVE_SLOT}"

            curl -kfsS -o /dev/null -w "site:%{http_code}\n" https://jobaisearch.ru/
            curl -kfsS -o /dev/null -w "health:%{http_code}\n" https://jobaisearch.ru/health
