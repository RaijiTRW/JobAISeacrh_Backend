name: Deploy Backend to VDS (jobaisearch.ru)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VDS via rsync
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete --exclude='.env*' --exclude='__pycache__/' --exclude='*.pyc' --exclude='.git/' --exclude='logs/'
          path: /
          remote_path: /var/www/jobaisearch/backend/JobAISeacrh_Backend
          remote_host: ${{ secrets.VDS_HOST }}
          remote_user: ${{ secrets.VDS_USERNAME }}
          remote_key: ${{ secrets.VDS_SSH_KEY }}

      - name: Zero-downtime deployment on VDS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USERNAME }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script_stop: true
          script: |
            set -e

            cd /var/www/jobaisearch/backend/JobAISeacrh_Backend

            # Ensure logs directory exists
            mkdir -p logs

            echo "📦 Installing Python dependencies..."
            pip3 install -r requirements.txt --quiet

            echo "🔄 Starting or updating PM2 cluster..."
            # Check if app exists
            if pm2 describe jobaisearch-backend >/dev/null 2>&1; then
              echo "App exists, reloading with zero-downtime..."
              # Reload cluster mode - restarts instances one by one
              pm2 reload ecosystem.config.js --update-env
            else
              echo "Starting new cluster..."
              pm2 start ecosystem.config.js
            fi

            # Save PM2 config for auto-start on reboot
            pm2 save --force

            echo "⏳ Waiting for instances to be ready..."
            sleep 5

            echo "✅ Deployment complete! Zero-downtime achieved."
            pm2 status

            # Health check
            echo ""
            echo "🔍 Health check:"
            curl -sf http://localhost:8000/health || echo "⚠️ Health check failed"

            # Show recent logs
            echo ""
            echo "📋 Recent logs:"
            pm2 logs jobaisearch-backend --lines 3 --nostream
